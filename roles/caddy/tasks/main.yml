---
- name: Allow firewall
  community.general.ufw:
    rule: allow
    name: WWW Full

- name: Allow HTTP/3 (QUIC)
  community.general.ufw:
    rule: allow
    proto: udp
    to_port: "443"
    comment: Caddy HTTP/3

- name: Install
  ansible.builtin.include_role:
    name: caddy-ansible.caddy-ansible

- name: Install jq
  become: true
  ansible.builtin.package:
    name: jq

- name: Adjust certs
  ansible.builtin.include_tasks:
    file: certs.yml
  tags:
    - caddy_certs

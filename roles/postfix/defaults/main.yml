---
postfix_mailname: "{{ ansible_facts['fqdn'] }}"
postfix_destinations:
  - "{{ ansible_facts['fqdn'] }}"
postfix_aliases:
  postmaster:
    alias: root
  webmaster:
    alias: root
  www-data:
    alias: root
  hostmaster:
    alias: root
  list:
    alias: root
  uplinks:
    alias: root
  ssladministrator:
    alias: root
  ssladmin:
    alias: root
  planet:
    alias: root
